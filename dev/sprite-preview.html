<!doctype html><meta charset="utf-8"><title>キャラクター4方向プレビュー</title><style>body{margin:0;background:#eef3dd;color:#364c45;font:14px sans-serif}h1{font-size:17px;margin:12px}canvas{display:block;image-rendering:pixelated}</style><h1>4方向 / 足元基準・上方向への張り出し</h1><canvas id="sprites" width="680" height="1400"></canvas><script type="module">
import {spritePixels,PIXEL_COLORS} from '/src/render/SpriteAtlas.ts';
import { ENEMIES, SUPPORT_ACTORS } from '/src/data/enemies.ts';
const definitions=Object.values({...ENEMIES,...SUPPORT_ACTORS});
const ctx=document.querySelector('canvas').getContext('2d');
const kinds=['player','slime','goblin','fighter','reaper','archer','mage','wolf','treant','sprite','greaterSprite','golem'];
for(let i=0;i<kinds.length;i++){const kind=kinds[i],row=30+i*110;ctx.fillStyle='#364c45';ctx.fillText(kind,8,row+45);
for(let n=0;n<4;n++){const dir=['down','left','up','right'][n],p=spritePixels(kind,dir),definition=definitions.find(d=>d.sprite===kind),sy=(definition.renderHeight??p.length*2)/p.length,lift=definition.renderLift??0,x=125+n*135,foot=row+86,size=kind==='golem'?64:32;ctx.fillStyle='#e2eacb';ctx.fillRect(x,foot-size,size,size);ctx.strokeStyle='#a2b391';ctx.strokeRect(x,foot-size,size,size);ctx.fillStyle='#364c45';ctx.fillText(dir,x,row-8);
for(let y=0;y<p.length;y++)for(let px=0;px<p[y].length;px++){const c=PIXEL_COLORS[p[y][px]];if(c){ctx.fillStyle=c;ctx.fillRect(x+size/2-p[y].length+px*2,Math.round(foot-p.length*sy+y*sy-lift),2,sy)}}}}
</script>
