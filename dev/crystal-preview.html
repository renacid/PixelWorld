<!doctype html><html lang="ja"><meta charset="utf-8"><title>結晶の飛行・破裂プレビュー</title>
<style>body{margin:24px;background:#eef3dd;color:#364c45;font:14px sans-serif}canvas{image-rendering:pixelated;display:block}h1{font-size:20px}a{color:#367654}</style>
<h1>結晶の飛行 → 着弾 → 破裂</h1><p>ゲームと同じ描画。氷結晶と雷結晶を繰り返し表示します。</p><p><a href="?frame=180">飛行途中</a> ／ <a href="?frame=470">破裂途中</a> ／ <a href="?">アニメーション</a> ／ <a href="./terrain-preview.html">地形プレビューへ</a></p><canvas width="384" height="224"></canvas>
<script type="module">
import {drawCrystalFlight} from '/src/render/CrystalSprites.ts';
import {CRYSTAL_FLIGHT_MS,CRYSTAL_BURST_MS} from '/src/game/CrystalTiming.ts';
const ctx=document.querySelector('canvas').getContext('2d'),duration=CRYSTAL_FLIGHT_MS+CRYSTAL_BURST_MS,fixed=new URLSearchParams(location.search).get('frame');
function draw(time){ctx.clearRect(0,0,384,224);const elapsed=fixed===null?time%1800:Number(fixed),age=Math.min(1,elapsed/duration);
 for(const [n,attribute] of ['ice','thunder'].entries()){
  const y=40+n*90;ctx.fillStyle='#364c45';ctx.fillText(attribute==='ice'?'氷結晶':'雷結晶',4,y+20);
  ctx.fillStyle='#a2cb8b';ctx.fillRect(96,y,160,32);ctx.strokeStyle='#628665';for(let x=96;x<256;x+=32)ctx.strokeRect(x,y,32,32);
  if(elapsed<duration)drawCrystalFlight(ctx,attribute,{x:160,y},{x:192,y},age);
  if(elapsed>=CRYSTAL_FLIGHT_MS&&elapsed<1100){ctx.fillStyle=attribute==='ice'?'#2386b5':'#9152c5';ctx.fillText('3',203,y-4-(elapsed-CRYSTAL_FLIGHT_MS)*.012);}
 }requestAnimationFrame(draw);
}requestAnimationFrame(draw);
</script></html>
